name = "fde-radar"
main = "worker/index.ts"
compatibility_date = "2026-08-09"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "fde-radar"
database_id = "17fda701-71ee-419e-a5a0-12aab2879984"
migrations_dir = "migrations"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "35c833b89d0f412f8144c66ef749cad4"

# Enable R2 in the Cloudflare Dashboard, create this bucket, then uncomment.
# [[r2_buckets]]
# binding = "ARCHIVE"
# bucket_name = "fde-radar-archive"

[[kv_namespaces]]
binding = "CACHE"
id = "b1ae67d6729f46f48e18628203226f7b"

[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "fde-radar-ingest"

[[queues.consumers]]
queue = "fde-radar-ingest"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
max_concurrency = 5

[triggers]
crons = ["0 */6 * * *"]
