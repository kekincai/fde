name = "fde-radar"
main = "worker/index.ts"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "fde-radar"
database_id = "00000000000000000000000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "fde-radar-archive"

[[kv_namespaces]]
binding = "CACHE"
id = "00000000000000000000000000000000"

[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "fde-radar-ingest"

[[queues.consumers]]
queue = "fde-radar-ingest"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3

[triggers]
crons = ["0 23 * * *"]
